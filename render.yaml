services:
  - type: web
    name: resenha-backend
    env: node
    region: ohio
    # Plano free: o serviço hiberna após ~15 min sem tráfego. O código convive
    # com isso — o polling do placar segura o backend acordado durante a
    # partida, o startMatch é idempotente (o site reavisa se o start se perder)
    # e a varredura do boot encerra partidas cujo lobby já foi finalizado
    # (END_MATCH perdido no cold start).
    plan: free
    buildCommand: cd resenha-backend && npm install
    startCommand: cd resenha-backend && npm start
    envVars:
      - key: PORT
        value: 4000
      - key: TRUST_PROXY
        value: 1
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      # Versão atual do Resenha Client — client mais antigo é bloqueado até
      # atualizar. Dá pra subir por aqui sem redeploy do código.
      - key: CLIENT_LATEST_VERSION
        sync: false
      # Link absoluto do instalador no site (botão "Baixar atualização").
      - key: CLIENT_DOWNLOAD_URL
        sync: false